# DO NOT commit real credentials. In practice:
#   kubectl create secret generic mongo-secret \
#     --namespace mern-app \
#     --from-literal=MONGO_URI='mongodb+srv://user:pass@cluster.mongodb.net/appdb'
#
# This file is a placeholder so the manifest set is complete for review.
apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
  namespace: mern-app
type: Opaque
stringData:
  MONGO_URI: "REPLACE_ME_VIA_KUBECTL_CREATE_SECRET"
